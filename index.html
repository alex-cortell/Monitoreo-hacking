<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL GLOBAL THREAT MONITOR | v4.0.2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Dependencies: Fixed versions for stability -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --color-white: #FFFFFF;
            --color-black: #000000;
            --color-gray-dark: #171717;
            --color-gray-mid: #777777;
            --color-gray-light: #EAEAEA;
            --border-ui: 1px solid #222222;
            --font-main: 'Inter', sans-serif;
            --font-tech: 'IBM Plex Sans', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--color-black);
            color: var(--color-white);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- UI LAYOUT --- */
        #app {
            position: relative;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 300px 1fr 320px;
            grid-template-rows: 40px 1fr 35px;
            grid-template-areas: 
                "header header header"
                "left main right"
                "footer footer footer";
            z-index: 10;
            pointer-events: none;
        }

        header, aside, footer {
            pointer-events: auto;
            backdrop-filter: blur(10px);
            background: rgba(0, 0, 0, 0.6);
        }

        header {
            grid-area: header;
            border-bottom: var(--border-ui);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-brand {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: var(--color-white);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        aside {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .left-panel { grid-area: left; border-right: var(--border-ui); }
        .right-panel { grid-area: right; border-left: var(--border-ui); }

        footer {
            grid-area: footer;
            border-top: var(--border-ui);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-gray-mid);
        }

        /* --- COMPONENTS --- */
        .module-header {
            font-family: var(--font-mono);
            font-size: 9px;
            color: var(--color-gray-mid);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 6px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .stat-value { font-family: var(--font-mono); font-size: 22px; }
        .stat-label { font-size: 9px; color: var(--color-gray-mid); text-transform: uppercase; }

        .incident-item {
            font-family: var(--font-mono);
            padding: 8px 0;
            border-bottom: 1px solid #111;
        }

        .incident-info { font-size: 10px; color: var(--color-gray-light); display: block; margin: 4px 0; }
        .incident-meta { display: flex; gap: 8px; font-size: 8px; color: #444; }

        /* --- GLOBE & 2D VIEW --- */
        #viewport-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #000;
        }

        #view-toggle {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: auto;
            display: flex;
            gap: 10px;
            background: rgba(0,0,0,0.8);
            padding: 5px;
            border: var(--border-ui);
        }

        .toggle-btn {
            background: transparent;
            border: none;
            color: var(--color-gray-mid);
            padding: 5px 15px;
            font-family: var(--font-mono);
            font-size: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .toggle-btn.active {
            color: var(--color-white);
            background: #1a1a1a;
        }

        #map-2d-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* --- OVERLAYS --- */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 2;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background: rgba(255, 255, 255, 0.03);
            pointer-events: none;
            z-index: 3;
            animation: scanning 10s linear infinite;
        }

        @keyframes scanning { 0% { top: 0; } 100% { top: 100%; } }

        .chart-container { height: 120px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="viewport-container">
        <div id="globe-3d"></div>
        <div id="map-2d-container">
            <!-- 2D Map representation using Canvas/SVG -->
            <canvas id="map2d"></canvas>
        </div>
    </div>

    <div class="vignette"></div>
    <div class="scan-line"></div>

    <div id="view-toggle">
        <button class="toggle-btn active" onclick="switchView('3d')">3D PROJECTION</button>
        <button class="toggle-btn" onclick="switchView('2d')">2D MERCATOR</button>
    </div>

    <div id="app">
        <header>
            <div class="header-brand">
                <div class="status-dot"></div>
                <span>CYBER-INTELLIGENCE CENTER // CORE_v4</span>
            </div>
            <div id="clock-utc">00:00:00 UTC</div>
        </header>

        <aside class="left-panel">
            <div class="module">
                <div class="module-header">THREAT METRICS</div>
                <div style="display: flex; justify-content: space-between;">
                    <div>
                        <div class="stat-value" id="count-attacks">124,092</div>
                        <div class="stat-label">Active Attacks</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="stat-value">9.2</div>
                        <div class="stat-label">Risk Level</div>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="leftChart"></canvas>
                </div>
            </div>

            <div class="module">
                <div class="module-header">VECTOR DISTRIBUTION</div>
                <div style="font-family: var(--font-mono); font-size: 10px; color: var(--color-gray-mid);">
                    <div style="margin-bottom: 10px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                            <span>NETWORK LAYER</span><span>62%</span>
                        </div>
                        <div style="height: 1px; background: #222;"><div style="width: 62%; height: 100%; background: #fff;"></div></div>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                            <span>APPLICATION</span><span>24%</span>
                        </div>
                        <div style="height: 1px; background: #222;"><div style="width: 24%; height: 100%; background: #777;"></div></div>
                    </div>
                    <div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 3px;">
                            <span>DATABASE</span><span>14%</span>
                        </div>
                        <div style="height: 1px; background: #222;"><div style="width: 14%; height: 100%; background: #444;"></div></div>
                    </div>
                </div>
            </div>
        </aside>

        <main><!-- Center remains clear for protagonist --></main>

        <aside class="right-panel">
            <div class="module" style="height: 100%; display: flex; flex-direction: column;">
                <div class="module-header">
                    <span>INCIDENT FEED</span>
                    <span class="status-dot" style="width: 4px; height: 4px;"></span>
                </div>
                <div id="feed" style="flex: 1; overflow-y: hidden;">
                    <!-- Feed items -->
                </div>
                <div class="chart-container">
                    <canvas id="rightChart"></canvas>
                </div>
            </div>
        </aside>

        <footer>
            <div>COORD: <span id="mouse-coords">0.00, 0.00</span></div>
            <div>STATUS: ENCRYPTED_STREAM // NODE: MASTER-01</div>
            <div id="uptime">UPTIME: 00:00:00</div>
        </footer>
    </div>

    <script>
        // --- GLOBE 3D LOGIC (Native Three.js for reliability) ---
        let scene, camera, renderer, globe, clouds, arcs = [], controls;
        const container = document.getElementById('globe-3d');

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 250;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(5, 3, 5);
            scene.add(directionalLight);

            // Sphere
            const geometry = new THREE.SphereGeometry(100, 64, 64);
            
            // Texture with dark style
            const textureLoader = new THREE.TextureLoader();
            const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-dark.jpg');
            const bumpMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-topology.png');

            const material = new THREE.MeshStandardMaterial({
                color: 0x444444,
                map: earthTexture,
                bumpMap: bumpMap,
                bumpScale: 1,
                metalness: 0.1,
                roughness: 0.8,
            });

            globe = new THREE.Mesh(geometry, material);
            scene.add(globe);

            // Wireframe overlay for tech look
            const wireframe = new THREE.Mesh(
                new THREE.SphereGeometry(100.2, 40, 40),
                new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.03 })
            );
            scene.add(wireframe);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;
            controls.enablePan = false;
            controls.minDistance = 150;
            controls.maxDistance = 400;

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            updateArcs();
            renderer.render(scene, camera);
        }

        // --- ARCS / ATTACKS 3D ---
        function createArc() {
            const startLat = (Math.random() - 0.5) * 160;
            const startLng = (Math.random() - 0.5) * 360;
            const endLat = (Math.random() - 0.5) * 160;
            const endLng = (Math.random() - 0.5) * 360;

            const startPos = latLngToVector3(startLat, startLng, 100);
            const endPos = latLngToVector3(endLat, endLng, 100);

            // Curve
            const dist = startPos.distanceTo(endPos);
            const midPos = startPos.clone().lerp(endPos, 0.5).normalize().multiplyScalar(100 + dist * 0.2);
            const curve = new THREE.QuadraticBezierCurve3(startPos, midPos, endPos);
            
            const geometry = new THREE.BufferGeometry().setFromPoints(curve.getPoints(50));
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
            const line = new THREE.Line(geometry, material);
            
            scene.add(line);
            
            // Traveling particle
            const pGeom = new THREE.SphereGeometry(0.4, 8, 8);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const particle = new THREE.Mesh(pGeom, pMat);
            scene.add(particle);

            arcs.push({
                line, particle, curve, progress: 0, 
                speed: 0.005 + Math.random() * 0.01,
                onComplete: () => {
                    scene.remove(line);
                    scene.remove(particle);
                }
            });

            addIncident(startLat, startLng, endLat, endLng);
        }

        function updateArcs() {
            for (let i = arcs.length - 1; i >= 0; i--) {
                const arc = arcs[i];
                arc.progress += arc.speed;
                if (arc.progress >= 1) {
                    arc.onComplete();
                    arcs.splice(i, 1);
                } else {
                    const pos = arc.curve.getPoint(arc.progress);
                    arc.particle.position.copy(pos);
                    arc.line.material.opacity = Math.sin(arc.progress * Math.PI) * 0.5;
                }
            }
        }

        function latLngToVector3(lat, lng, radius) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lng + 180) * (Math.PI / 180);
            return new THREE.Vector3(
                -radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        // --- 2D MAP LOGIC ---
        const canvas2d = document.getElementById('map2d');
        const ctx2d = canvas2d.getContext('2d');

        function init2D() {
            canvas2d.width = window.innerWidth;
            canvas2d.height = window.innerHeight;
            draw2DBase();
        }

        function draw2DBase() {
            ctx2d.fillStyle = '#000';
            ctx2d.fillRect(0, 0, canvas2d.width, canvas2d.height);
            
            // Draw grid
            ctx2d.strokeStyle = '#111';
            ctx2d.lineWidth = 1;
            const step = 40;
            for(let x=0; x<canvas2d.width; x+=step) { ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,canvas2d.height); ctx2d.stroke(); }
            for(let y=0; y<canvas2d.height; y+=step) { ctx2d.beginPath(); ctx2d.moveTo(0,y); ctx2d.lineTo(canvas2d.width,y); ctx2d.stroke(); }

            // Label
            ctx2d.fillStyle = '#333';
            ctx2d.font = '10px IBM Plex Mono';
            ctx2d.fillText('MERCATOR_PROJECTION_v1.0', 320, 60);
        }

        function switchView(type) {
            const container3d = document.getElementById('globe-3d');
            const container2d = document.getElementById('map-2d-container');
            const btns = document.querySelectorAll('.toggle-btn');
            
            btns.forEach(b => b.classList.remove('active'));
            if(type === '3d') {
                container3d.style.display = 'block';
                container2d.style.display = 'none';
                container2d.style.opacity = '0';
                btns[0].classList.add('active');
            } else {
                container3d.style.display = 'none';
                container2d.style.display = 'flex';
                setTimeout(() => container2d.style.opacity = '1', 10);
                btns[1].classList.add('active');
                init2D();
            }
        }

        // --- UI & FEED ---
        const feed = document.getElementById('feed');
        const types = ["DDoS_FLOOD", "SQL_INJECT", "XSS_SCRIPT", "RANSOM_SCAN", "AUTH_BRUTE"];

        function addIncident(slat, slng, elat, elng) {
            const type = types[Math.floor(Math.random() * types.length)];
            const time = new Date().toISOString().split('T')[1].split('.')[0];
            const item = document.createElement('div');
            item.className = 'incident-item';
            item.innerHTML = `
                <div style="display:flex;justify-content:space-between;font-size:9px;">
                    <span style="color:#fff">${type}</span>
                    <span style="color:#444">${time}</span>
                </div>
                <span class="incident-info">SRC: ${slat.toFixed(2)},${slng.toFixed(2)} -> DST: INT_NODE_${Math.floor(Math.random()*9)}</span>
                <div class="incident-meta"><span>SEV: HIGH</span><span>PROT: TCP</span></div>
            `;
            feed.prepend(item);
            if(feed.children.length > 12) feed.removeChild(feed.lastChild);
            
            const count = document.getElementById('count-attacks');
            count.innerText = (parseInt(count.innerText.replace(',','')) + 1).toLocaleString();
        }

        // --- CHARTS & BOOT ---
        window.onload = () => {
            init3D();
            lucide.createIcons();
            
            // Charts
            const chartCfg = (color) => ({
                type: 'line',
                data: { labels: Array(10).fill(''), datasets: [{ data: Array(10).fill(0).map(()=>Math.random()*100), borderColor: color, borderWidth: 1, pointRadius: 0, fill: true, backgroundColor: 'rgba(255,255,255,0.02)', tension: 0.4 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
            new Chart(document.getElementById('leftChart'), chartCfg('#fff'));
            new Chart(document.getElementById('rightChart'), chartCfg('#777'));

            // Simulation
            setInterval(() => { if(arcs.length < 40) createArc(); }, 800);
            
            // Clock & Uptime
            const start = Date.now();
            setInterval(() => {
                document.getElementById('clock-utc').innerText = new Date().toISOString().split('T')[1].split('.')[0] + ' UTC';
                const s = Math.floor((Date.now()-start)/1000);
                const h = Math.floor(s/3600).toString().padStart(2,'0');
                const m = Math.floor((s%3600)/60).toString().padStart(2,'0');
                const sec = (s%60).toString().padStart(2,'0');
                document.getElementById('uptime').innerText = `UPTIME: ${h}:${m}:${sec}`;
            }, 1000);
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            if(canvas2d.style.display !== 'none') init2D();
        });

        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth * 360 - 180).toFixed(2);
            const y = (0.5 - e.clientY / window.innerHeight * 180).toFixed(2);
            document.getElementById('mouse-coords').innerText = `${y}, ${x}`;
        });

    </script>
</body>
</html>
